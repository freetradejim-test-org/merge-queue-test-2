name: deploy
on:
  push:
    branches: [main]

jobs:
  # Holds the deploy back so the next queue check reaches prod-manifest first.
  delay:
    runs-on: ubuntu-latest
    steps:
      - run: sleep 20

  deploy:
    needs: delay
    runs-on: ubuntu-latest
    concurrency:
      group: prod-manifest
      queue: max
      cancel-in-progress: false
    steps:
      - run: sleep 120
